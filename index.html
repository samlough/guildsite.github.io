<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Distribution</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-functions.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/leader-dash">Loot List</a>
      <a href="#archived-loot">Archived Loot</a>
      <a href="#sign-in">Sign In</a>
    </nav>
    <div id="leader-login" class="hidden">
      <h2>Leader Login</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>
      <!-- Loot List Section -->
      <section id="loot-list">
        <h2>Current Loot</h2>
        <div class="loot-item">
            <h3>Item Name</h3>
            <p>Description of the item.</p>
            <p>Time Remaining: 2 days</p>
            <form>
                <input type="text" placeholder="Enter your name" required>
                <button type="submit">Roll for this item</button>
            </form>
        </div>
        <!-- Repeat for other items -->
    </section>
    <script src="app.js"></script>
  </body>
</html>
